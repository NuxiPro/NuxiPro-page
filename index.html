        <h1 style="font-size:2.5rem;margin-bottom:16px">What if your tool evolved with you, without overloading you with useless features?</h1>
        <p style="font-size:1.1rem;color:#6c6a64;line-height:1.7;margin-bottom:24px">Stop wasting time looking for a tool built for solo users, minimalist by default, that cleans your workspace on its own: NuxiPro does the essentials and simplifies your daily life.</p>
        <p style="margin-top:24px"><a href="https://demo.nuxipro.com" style="display:inline-block;background:#0d9488;color:white;padding:12px 32px;border-radius:8px;text-decoration:none;font-weight:500">Try demo without account →</a></p>
        <h2 style="font-size:1.5rem;margin-top:32px;margin-bottom:12px">Why I built this software</h2>
        <p style="color:#3d3d3a;line-height:1.75">I was using proprietary solutions I couldn't audit, and they didn't solve my problem: my workspace was becoming a graveyard of completed tasks.</p>
        <p style="color:#3d3d3a;line-height:1.75;margin-top:12px">I tried todo lists and kanbans: they share one thing in common, tasks stay visible even when they're done. I tried Todoist but it didn't move tasks to a dedicated archive space, so they reloaded in the background every time I opened the page, which hurt performance.</p>
        <p style="color:#3d3d3a;line-height:1.75;margin-top:12px">So I decided to build this minimalist tool, deliberately limited to the essentials, sovereign and respectful of your privacy. It's also open source: you'll never be locked into the software, your data is yours and you can migrate to a VPS or dedicated server to self-host with peace of mind.</p>
        <h2 style="font-size:1.5rem;margin-top:32px;margin-bottom:12px">What I get from using this software</h2>
        <ul style="color:#3d3d3a;line-height:1.75;padding-left:20px">
          <li><strong>Zero friction</strong> — Manual archiving of your tasks disappears completely.</li>
          <li><strong>Zero visual clutter</strong> — No more completed tasks polluting your workspace, make room for what matters.</li>
          <li><strong>Simple tracking</strong> — Visualize your progress and daily wins, effortlessly.</li>
          <li><strong>No useless features</strong> — Focus on what matters without being overwhelmed by features you'll never use.</li>
          <li><strong>Quick start</strong> — A tool ready to use, simple day-to-day and ready to handle your tasks.</li>
        </ul>
        <p style="margin-top:32px"><a href="https://demo.nuxipro.com" style="display:inline-block;background:#0d9488;color:white;padding:12px 32px;border-radius:8px;text-decoration:none;font-weight:500">Try demo without account →</a></p>
        <h2 style="font-size:1.5rem;margin-top:40px;margin-bottom:12px">Demo vs Cloud</h2>
        <ul style="color:#3d3d3a;line-height:1.75;padding-left:20px">
          <li><strong>Usage case:</strong> Demo — Test and discover the concept / Cloud — Store and use daily without losing data</li>
          <li><strong>Need to create an account?</strong> Demo — No / Cloud — Yes</li>
          <li><strong>Native archive type:</strong> Demo — Instant archive / Cloud — Two archive types: instant and date‑based (temporal)</li>
          <li><strong>Estimated availability duration:</strong> Demo — Time-limited: will be stopped and replaced by a Cloud-based demo / Cloud — Indefinite, used daily by the creator</li>
          <li><strong>Where are the data stored?</strong> Demo — In your browser / Cloud — In a sovereign European cloud</li>
          <li><strong>Simplicity?</strong> Demo — Very simple and works right away / Cloud — Simple, requires a small guided configuration</li>
          <li><strong>Data sovereignty:</strong> Demo — High – data stays in the browser, only anonymous analytics / Cloud — High – data remains yours, hosted in Europe, optional self‑hosting</li>
          <li><strong>Self‑hostable?</strong> Demo — No / Cloud — Yes, once stable you can deploy it without hassle</li>
          <li><strong>Open source?</strong> Demo — No (proprietary, will be replaced by an open-source Cloud-based demo) / Cloud — Yes (AGPLv3)</li>
          <li><strong>Primary purpose:</strong> Demo — Test without critical data / Cloud — Simple daily tool, secure storage</li>
        </ul>
        <h2 style="font-size:1.5rem;margin-top:40px;margin-bottom:12px">Discover NuxiPro Cloud or try the tool today</h2>
        <p style="color:#3d3d3a;line-height:1.75">Sign up for priority access at launch or explore the live demo instantly without creating an account.</p>
        <h2 style="font-size:1.5rem;margin-top:40px;margin-bottom:12px">Frequently Asked Questions</h2>
        <dl style="color:#3d3d3a;line-height:1.75">
          <dt style="font-weight:600;margin-top:16px">What is NuxiPro?</dt>
          <dd style="margin:4px 0 0 0">NuxiPro is a minimalist personal task manager that automatically cleans your Kanban board by archiving completed tasks.</dd>
          <dt style="font-weight:600;margin-top:16px">Is NuxiPro built for team collaboration?</dt>
          <dd style="margin:4px 0 0 0">No team features for now. NuxiPro stays solo-first: personal productivity without team overhead, notifications, or clutter. Team remains a possible optional upgrade later — only once solo is fully ready, not before, and only if you want to evolve.</dd>
          <dt style="font-weight:600;margin-top:16px">How does automatic task archiving work?</dt>
          <dd style="margin:4px 0 0 0">The demo archives tasks instantly when moved to Done — data stays in your browser only. In the cloud version, you simply choose your archiving mode at sign-up: instant archiving or archiving after X days.</dd>
          <dt style="font-weight:600;margin-top:16px">Can I test NuxiPro right now?</dt>
          <dd style="margin:4px 0 0 0">Yes, you can try the free interactive demo directly at demo.nuxipro.com without creating an account.</dd>
          <dt style="font-weight:600;margin-top:16px">How can I access the full version of NuxiPro?</dt>
          <dd style="margin:4px 0 0 0">The full version (app.nuxipro.com) is currently in development and not accessible yet. You can join the waitlist to get early access at launch.</dd>
          <dt style="font-weight:600;margin-top:16px">Can I still find my tasks once they are archived?</dt>
          <dd style="margin:4px 0 0 0">Yes, all archived tasks are safely stored and remain accessible at any time in your dedicated archive area.</dd>
          <dt style="font-weight:600;margin-top:16px">Is the cloud version of NuxiPro minimalist?</dt>
          <dd style="margin:4px 0 0 0">Yes. I use NuxiPro Cloud for my own projects, so I keep only the essentials: solo-first by default, no team overhead, no Jira-like onboarding with endless fields. You learn it once by using it. Team features may come later, strictly optional — only once solo is fully ready, never required upfront.</dd>
          <dt style="font-weight:600;margin-top:16px">Will the current demo disappear?</dt>
          <dd style="margin:4px 0 0 0">No.<br><br>The current demo at <a href="https://demo.nuxipro.com">demo.nuxipro.com</a> is not open source and is time-limited: it will be stopped.<br><br>It will be replaced by an open-source, very simplified Cloud-based demo without account (browser-limited, time-limited storage) only after NuxiPro Cloud is ready — not before, to avoid wasting time on a demo while Cloud is not ready.<br><br>This is planned, no date promised.<br><br>Don't use the current demo for real work: data stays in your browser and can be lost.</dd>
          <dt style="font-weight:600;margin-top:16px">Is NuxiPro open source and self-hostable?</dt>
          <dd style="margin:4px 0 0 0">Yes. NuxiPro Cloud is open source (AGPLv3) on Codeberg and self-hostable, but not production-ready: still in development.</dd>
          <dt style="font-weight:600;margin-top:16px">Where is NuxiPro hosted and is it GDPR-compliant?</dt>
          <dd style="margin:4px 0 0 0">NuxiPro Cloud is hosted in Finland (UpCloud, Europe) and your data stays in Europe.<br><br>GDPR roadmap: legal hub, documented sub-processors, consent traceability.<br><br>Honest black spots (Cloud version only, not your data): frontend + DNS on Cloudflare (US company) and monitoring via OpenObserve (US company even with EU servers).<br><br>Planned: migrate DNS + frontend away from Cloudflare and self-host OpenObserve in my own infra for full sovereignty when means allow — for now, I stay on their managed services.</dd>
        </dl>
        <p style="margin-top:40px;color:#3d3d3a;line-height:1.75">Manage your projects without worrying about the tool, every day.</p>
