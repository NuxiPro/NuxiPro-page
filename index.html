        <h2 style="font-size:1.5rem;margin-top:32px;margin-bottom:12px">Why I built this software</h2>
        <p style="color:#3d3d3a;line-height:1.75">Today's tools are packed with features we never use. The result: cluttered, complex interfaces with no native automatic archiving for completed tasks.</p>
        <p style="color:#3d3d3a;line-height:1.75;margin-top:12px">Without this cleanup, the "Done" column becomes a graveyard of cards. We waste precious time figuring out how to archive and cleaning up manually, instead of moving our project forward.</p>
        <p style="color:#3d3d3a;line-height:1.75;margin-top:12px">I built NuxiPro to offer a simple, minimalist Kanban that's ready to use. As soon as a task slides into the "Done" column, it's instantly archived in the background. Minimal configuration, zero complexity, and your board stays clean from day one. The demo archives tasks instantly by default — data stays in your browser and may be lost, so it's not meant for real work. The cloud version (coming soon) will let you choose your archiving mode and persist your data.</p>

          <dt style="font-weight:600;margin-top:16px">Is NuxiPro built for team collaboration?</dt>
          <dd style="margin:4px 0 0 0">No. NuxiPro is intentionally designed for personal and single-user productivity, eliminating team features, notifications, and clutter.</dd>
          <dt style="font-weight:600;margin-top:16px">How does automatic task archiving work?</dt>
